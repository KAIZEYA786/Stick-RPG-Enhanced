g.textAlign='center';g.fillStyle='#fff';g.font=((90*(1+.08*Math.sin(e*3)))|0)+'px sans-serif';g.fillText(card.e,vw/2,vh/2-10);g.font='bold 30px sans-serif';g.lineWidth=5;g.strokeStyle='#000';g.strokeText(card.n,vw/2,vh/2+50);g.fillText(card.n,vw/2,vh/2+50);g.font='15px sans-serif';g.fillStyle='#9fb3d9';g.fillText('Welcome in!',vw/2,vh/2+80);g.globalAlpha=1}
